<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small world</title>
<script src="https://unpkg.com/3dmol/build/3Dmol-min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#0B0C0E; --panel:rgba(20,22,25,.82); --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.18); --fg:#EAEBEE; --fg-2:#9A9EA7; --fg-3:#63676F;
    --accent:#6EA8FE; --danger:#F2777A;
  }
  *{box-sizing:border-box}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--fg); font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #viewer{position:fixed; inset:0}
  #viewer canvas{display:block}

  .box{
    position:fixed; z-index:10; width:250px; padding:12px;
    background:var(--panel); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; gap:8px;
    cursor:grab; user-select:none; touch-action:none;
  }
  .box.drag{cursor:grabbing; border-color:var(--line-strong)}
  .box input,.box select,.box button{cursor:auto; user-select:auto}
  #bInfo{right:16px; top:16px; width:auto; max-width:250px; padding:9px 12px}
  #bCtl{left:16px; top:16px}
  #bRep{left:16px; bottom:16px}

  .sub{color:var(--fg-3); font-size:12px; line-height:1.4}
  select,input[type=text]{
    width:100%; height:32px; padding:0 10px; color:var(--fg); background:rgba(255,255,255,.04);
    border:1px solid var(--line); border-radius:8px; font:inherit; outline:0;
  }
  select:focus,input:focus{border-color:var(--line-strong)}
  select option{background:#141619}
  .row{display:flex; gap:6px; align-items:center}
  .btn{
    flex:1; height:30px; border-radius:8px; border:1px solid var(--line); cursor:pointer;
    background:rgba(255,255,255,.03); color:var(--fg-2); font:inherit;
  }
  .btn:hover{color:var(--fg); border-color:var(--line-strong)}
  .btn.on{background:rgba(110,168,254,.16); color:var(--accent); border-color:rgba(110,168,254,.35)}
  input[type=range]{flex:1; accent-color:var(--accent); cursor:pointer; margin:0}
  #tval{width:56px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums}
  #err{color:var(--danger); font-size:12px; display:none} #err.show{display:block}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px}
  .stat b{font-size:16px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .stat span{color:var(--fg-3); font-size:11.5px; margin-left:4px}
  #rdf{width:100%; height:48px; display:block}
</style>
</head>
<body>
<div id="viewer"></div>

<div class="box" id="bInfo"><div class="sub" id="boxSub">…</div></div>

<div class="box" id="bCtl">
  <input type="text" id="comp" placeholder="100 Al + 30 Au + 40 Ni" autocomplete="off" spellcheck="false">
  <div id="compOut" class="sub"></div>
  <select id="engine"></select>
  <div id="note" class="sub" hidden></div>
  <div class="row"><input type="range" id="temp" min="10" max="3000" step="10" value="300"><b id="tval">300 K</b></div>
  <div class="row"><button class="btn" id="run">Run</button><button class="btn" id="reset">Reset</button></div>
  <div id="err"></div>
</div>

<div class="box" id="bRep">
  <div class="stats">
    <div class="stat"><b id="sT">–</b><span>K</span></div>
    <div class="stat"><b id="sE">–</b><span>eV/atom</span></div>
    <div class="stat"><b id="st">–</b><span>ps</span></div>
    <div class="stat"><b id="sS">–</b><span>ps/s</span></div>
  </div>
  <svg id="rdf" viewBox="0 0 226 48" preserveAspectRatio="none"><polyline id="rdfLine" fill="none" stroke="#6EA8FE" stroke-width="1.5"/></svg>
  <div class="sub">g(r) to 7 Å · sharp = crystal, smooth = liquid</div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = (window.API_BASE || '');
const api = (op, body = {}) => fetch(API + '/api/sim/cmd', { method:'POST', headers:{ 'Content-Type':'application/json' },
  body: JSON.stringify({ op, ...body }) }).then(r => r.json());

/* ---------- viewer ---------- */
const viewer = $3Dmol.createViewer($('#viewer'), { backgroundColor:'#0B0C0E', antialias:true });
let firstFrame = true, lastBox = 0;
function draw(f){
  const v = viewer.getView();
  viewer.removeAllModels();
  viewer.addModel(f.el.length + '\n\n' + f.el.map((e, i) => e + ' ' + f.xyz[i].join(' ')).join('\n'), 'xyz');
  viewer.setStyle({}, { sphere:{ scale:.34, colorscheme:'Jmol' } });
  if (f.box !== lastBox){
    viewer.removeAllShapes();
    const L = f.box, P = i => ({ x:(i & 1) ? L : 0, y:(i & 2) ? L : 0, z:(i & 4) ? L : 0 });
    for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b))
      viewer.addLine({ start:P(i), end:P(i | b), color:'#5a5e66', linewidth:1 });
    lastBox = f.box;
  }
  if (firstFrame){ viewer.zoomTo(); viewer.rotate(20, 'x'); viewer.rotate(30, 'y'); firstFrame = false; }
  else viewer.setView(v);
  viewer.render();
}

/* ---------- state ---------- */
let state = null, tempBusy = false;
const compEl = $('#comp'), tempEl = $('#temp');

function applyState(s){
  if (state && s.gen !== undefined && s.gen < state.gen) return;   // frame from before the last rebuild
  state = s;
  if (!$('#engine').options.length){
    Object.entries(s.engines).forEach(([k, l]) => $('#engine').add(new Option(l, k)));
    compEl.value = s.comp.map(([e, n]) => (n === null ? '' : n + ' ') + e).join(' + ');
  }
  [...$('#engine').options].forEach(o => o.text = s.engines[o.value] || o.text);
  $('#engine').value = s.engine;
  $('#note').textContent = s.note || ''; $('#note').hidden = !s.note;
  $('#boxSub').textContent = `4×4×4 fcc · ${s.n_atoms} atoms in ${s.sites} sites · hard walls`;
  if (document.activeElement !== compEl) showComp(parseComp(compEl.value));
  $('#run').textContent = s.running ? 'Pause' : 'Run';
  $('#run').classList.toggle('on', s.running);
  if (!tempBusy && +tempEl.value !== s.target_T){ tempEl.value = s.target_T; $('#tval').textContent = Math.round(s.target_T) + ' K'; }
  $('#sT').textContent = s.T.toFixed(0); $('#sE').textContent = s.E.toFixed(3);
  $('#st').textContent = s.t_ps.toFixed(2); $('#sS').textContent = s.running ? s.speed.toFixed(2) : '–';
  $('#err').textContent = s.error; $('#err').classList.toggle('show', !!s.error);
  const pts = s.rdf.map((g, i) => (i / (s.rdf.length - 1) * 226).toFixed(1) + ',' + (46 - Math.min(g, 8) / 8 * 44).toFixed(1));
  $('#rdfLine').setAttribute('points', pts.join(' '));
  draw(s);
}
async function poll(){
  try { applyState(await fetch(API + '/api/sim/frame').then(r => r.json())); } catch(e){}
  setTimeout(poll, state && state.running ? 66 : 500);
}
function subscribe(){
  if (!window.WebSocket) return poll();
  const base = API || location.origin;
  const ws = new WebSocket(base.replace(/^http/, 'ws') + '/api/sim/ws');
  window.__frames = 0;
  ws.onmessage = e => { window.__frames++; applyState(JSON.parse(e.data)); };
  ws.onclose = () => setTimeout(subscribe, 1500);
  ws.onerror = () => ws.close();
}
subscribe();

/* ---------- controls ---------- */
$('#run').onclick   = () => api(state.running ? 'pause' : 'run').then(applyState);
$('#reset').onclick = () => api('reset').then(s => { firstFrame = true; applyState(s); });
$('#engine').onchange = e => api('set_engine', { engine:e.target.value }).then(applyState);

let tTimer;
tempEl.addEventListener('pointerdown', () => tempBusy = true);
tempEl.addEventListener('pointerup',   () => setTimeout(() => tempBusy = false, 400));
tempEl.oninput = e => {
  $('#tval').textContent = e.target.value + ' K';
  clearTimeout(tTimer); tTimer = setTimeout(() => api('set_T', { T:+e.target.value }).then(applyState), 120);
};

/* composition line: "30 Au + 40 Ni", "Al + 20 Ni", "gold 32, nickel 64", "Cu" */
const NAMES = { aluminium:'Al', aluminum:'Al', copper:'Cu', nickel:'Ni', silver:'Ag', gold:'Au',
                palladium:'Pd', platinum:'Pt', lead:'Pb', iridium:'Ir', rhodium:'Rh', iron:'Fe',
                cobalt:'Co', chromium:'Cr', manganese:'Mn', titanium:'Ti', vanadium:'V', zinc:'Zn',
                magnesium:'Mg', molybdenum:'Mo', tungsten:'W', niobium:'Nb', tantalum:'Ta',
                zirconium:'Zr', tin:'Sn', lithium:'Li', sodium:'Na', calcium:'Ca', silicon:'Si' };
const SITES = 256;
const elColor = e => { const c = ($3Dmol.elementColors.Jmol || {})[e]; return c === undefined ? '#999' : '#' + c.toString(16).padStart(6, '0'); };
const ELS = ['Al','Cu','Ni','Ag','Au','Pd','Pt','Pb','Ir','Rh','Fe','Co','Cr','Mn','Ti','V','Zn','Mg','Mo','W','Nb','Ta','Zr','Sn','Li','Na','Ca','Si'];
const resolveEl = raw => { const r = raw.toLowerCase();
  return NAMES[r] || ((state && state.elements) || ELS).find(e => e.toLowerCase() === r) || null; };

function parseComp(text){
  const terms = text.split(/[+,;]/).map(t => t.trim()).filter(Boolean);
  const comp = []; let bad = null, fill = null;
  for (const t of terms){
    const m = t.match(/^(\d+)?\s*[x×]?\s*([A-Za-z]+)\s*[x×]?\s*(\d+)?$/);
    const el = m && resolveEl(m[2]);
    if (!el){ bad = t; continue; }
    const n = m[1] || m[3];
    if (n === undefined) fill = el; else comp.push([el, +n]);
  }
  const used = comp.reduce((s, a) => s + a[1], 0);
  if (fill) comp.push([fill, null]);
  return { comp, bad, used, over: used > SITES };
}
function showComp(c){
  const parts = c.comp.map(([e, n]) => [e, n === null ? Math.max(0, SITES - c.used) : n]).filter(([, n]) => n > 0);
  const empty = SITES - parts.reduce((s, a) => s + a[1], 0);
  $('#compOut').innerHTML = parts.map(([e, n]) =>
    `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${elColor(e)};margin:0 5px 0 2px"></span>${e} ${n}`).join(' · ')
    + (empty > 0 && !c.over ? ` · <span style="color:var(--fg-3)">${empty} empty</span>` : '')
    + (c.over ? ` <span style="color:var(--danger)">· ${SITES} sites max, you have ${c.used}</span>` : '')
    + (c.bad ? ` <span style="color:var(--danger)">· "${c.bad}" not an element here</span>` : '');
}
let compTimer;
function applyComp(){
  const c = parseComp(compEl.value);
  showComp(c);
  if (c.over || !c.comp.length) return;
  api('set_comp', { comp:c.comp }).then(s => { firstFrame = true; applyState(s); });
}
compEl.oninput = () => { showComp(parseComp(compEl.value)); clearTimeout(compTimer); compTimer = setTimeout(applyComp, 350); };
compEl.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(compTimer); applyComp(); } };

/* ---------- movable boxes ---------- */
document.querySelectorAll('.box').forEach(box => {
  try { const p = JSON.parse(localStorage.getItem('box:' + box.id)); if (p){ box.style.left = p.x + 'px'; box.style.top = p.y + 'px'; box.style.right = box.style.bottom = 'auto'; } } catch(e){}
  let sx, sy, ox, oy;
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('input,select,button,a')) return;
    const r = box.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    box.style.left = ox + 'px'; box.style.top = oy + 'px'; box.style.right = box.style.bottom = 'auto';
    box.classList.add('drag'); box.setPointerCapture(e.pointerId);
  });
  box.addEventListener('pointermove', e => {
    if (!box.classList.contains('drag')) return;
    box.style.left = Math.max(0, ox + e.clientX - sx) + 'px';
    box.style.top  = Math.max(0, oy + e.clientY - sy) + 'px';
  });
  box.addEventListener('pointerup', () => {
    if (!box.classList.contains('drag')) return;
    box.classList.remove('drag');
    try { localStorage.setItem('box:' + box.id, JSON.stringify({ x:parseInt(box.style.left), y:parseInt(box.style.top) })); } catch(e){}
  });
});
addEventListener('resize', () => viewer.resize());
</script>
</body>
</html>
