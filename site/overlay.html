<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A10 film overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg0:#252F49; --bg1:#12151D; --txt:#F2F3F7; --dim:#8A90A2; --line:rgba(242,243,247,.55); --orange:#FF6B1A; --blue:#5B8DEF;
         --font:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace }
  html,body{margin:0; width:1600px; height:1100px; overflow:hidden; background:var(--bg1); color:var(--txt); font-family:var(--font); -webkit-font-smoothing:antialiased}
  #bg{position:fixed; inset:0; background:radial-gradient(ellipse 46% 58% at 62% 50%, var(--bg0) 0%, #1A2030 48%, var(--bg1) 100%)}
  #mol{position:fixed; inset:0; width:1600px; height:1100px}
  svg{position:fixed; inset:0; width:1600px; height:1100px}
  h1{position:fixed; left:96px; top:150px; margin:0; font-weight:500; font-size:88px; letter-spacing:-.025em; line-height:1}
  #lede{position:fixed; left:98px; top:268px; width:520px; font-size:21px; line-height:1.45; color:#D5D8E2}
  #steps{position:fixed; left:98px; bottom:150px; display:flex; flex-direction:column; gap:16px; font-size:20px}
  #steps div{display:flex; gap:16px; align-items:baseline; color:var(--dim); transition:none}
  #steps div.on{color:var(--txt)}
  #steps i{font-style:normal; font-size:15px; width:14px}
  #steps div.on i{color:var(--orange)}
  .lab{font-family:var(--mono); font-size:13px; letter-spacing:.06em; fill:#E6E8EF; text-transform:uppercase}
  .lab.sub{text-transform:none; fill:#8A90A2; letter-spacing:.03em}
  #meta{position:fixed; right:72px; bottom:56px; font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--dim); text-align:right; line-height:1.7}
</style>
</head>
<body>
<div id="bg"></div>
<img id="mol" alt="">
<svg id="ov"></svg>
<h1 id="title"></h1>
<div id="lede"></div>
<div id="steps"></div>
<div id="meta"></div>
<script>
const Q = new URLSearchParams(location.search), ID = Q.get('id') || 'atp';
const FILM = {
  atp: {
    title:'ATP synthase',
    lede:'The rotary motor in every living cell. Protons flowing through the membrane turn its rotor; each third of a turn makes one ATP.',
    steps:['At rest', 'Proton flow turns the rotor', 'One full turn · 3 ATP'],
    labels:[ { at:'head', text:['Stator head', 'α₃β₃ · makes ATP'], dy:-40 },
             { at:'stalk', text:['Central stalk', 'γε · turns inside the head'], dy:10 },
             { at:'ring', text:['Rotor ring', 'c₁₀ · in the membrane'], dy:60 } ],
    meta:f => [`Rotor ${Math.round(Math.abs(S.rotor_deg[f]))}°`, 'Coarse-grained MD · 4,849 residues', 'E. coli · PDB 6OQR'].map(x => x.toUpperCase()),
    flowLabel:'Proton flow',
  },
  rotor: {
    title:'Light-driven rotor',
    lede:'A molecule that turns when light hits it. Light loosens its central double bond; the top half swings round and locks in a new position.',
    steps:['Resting · stable shape', 'Light absorbed · central bond twists', 'Settles turned · new shape'],
    labels:[ { at:'rotor', text:['Rotor half', 'turns on the axle'] },
             { at:'axle', text:['Central C=C bond', 'the axle'] },
             { at:'stator', text:['Stator half', 'held still'] } ], stack:true,
    meta:f => [`TWIST ${Math.round(S.twist[f])}°`, `t = ${Math.round(S.t_ps[f] * 1000)} fs`, 'xTB MOLECULAR DYNAMICS · 48 ATOMS'],
    burst:'axle', burstLabel:'Light', dx:-120, X:1330,
  },
  niti: {
    title:'Shape-memory alloy',
    lede:'Nickel-titanium remembers its shape. Cooled, the crystal shears into a new lattice; heated, it snaps back. Stents and actuators run on this.',
    steps:['Hot · square lattice', 'Cooled · lattice shears into a new shape', 'Heated · snaps back to square'],
    labels:[ { at:'ni', text:['Nickel', 'atoms'] }, { at:'ti', text:['Titanium', 'atoms'] } ], stack:true, X:1330,
    meta:f => [`LATTICE ANGLE ${S.angle[f].toFixed(1)}°`, `${S.temp[f]} K · t = ${S.t_ps[f].toFixed(1)} ps`, 'MACE ML POTENTIAL · 250 ATOMS'],
    box:true,
  },
  electrolyte: {
    title:'Solid electrolyte',
    lede:'The core of a solid-state battery. Lithium ions hop through a fixed sulfide frame; with a voltage on, they all drift one way: a current.',
    steps:S0 => S0, labels:[ { at:'li', text:['Lithium ions', 'carry the charge'] }, { at:'ps4', text:['PS₄ cages', 'the fixed frame'] }, { at:'anion', text:['Cl⁻ and S²⁻', 'between the cages'] } ],
    stack:true, X:1330,
    meta:f => [`LI⁺ DRIFT ${S.drift[f] >= 0 ? '+' : ''}${S.drift[f].toFixed(1)} Å`, `${S.field[f] ? 'VOLTAGE ON' : S.temp[f] + ' K'} · t = ${S.t_ps[f].toFixed(1)} ps`, 'MACE ML POTENTIAL · 416 ATOMS'],
    arrowLabel:'Voltage',
  },
  mof: {
    title:'CO₂-capture MOF',
    lede:'A crystal full of channels. Flue gas meets it; CO₂ slips into the pores and stays, while N₂ is pushed back out.',
    steps:S0 => S0, labels:[ { at:'frame', text:['MIL-53 framework', 'Cr and terephthalate'] }, { at:'co2', text:['CO₂', 'trapped in a pore'] }, { at:'n2', text:['N₂', 'stays in the gas'] } ],
    stack:true, X:1330,
    meta:f => [`CO₂ INSIDE ${S.co2_in[f]} / ${S.n_co2}`, `N₂ INSIDE ${S.n2_in[f]} / ${S.n_n2}`, `t = ${(S.t_ps[f] / 1000).toFixed(2)} ns · CLASSICAL MD`],
  },
  polymer: {
    title:'Stress-sensing polymer',
    lede:'A plastic that shows where it is about to fail. Pull the chain hard enough and one bond in the ring snaps; the ring opens and turns coloured.',
    steps:S0 => S0, labels:[ { at:'ring', text:['Spiropyran ring', 'the sensor'] }, { at:'co', text:['Spiro C–O bond', 'the weak link'] }, { at:'chain', text:['Polymer chain', 'carries the load'] } ],
    stack:true, X:1330,
    meta:f => [`C–O BOND ${S.co[f].toFixed(2)} Å`, S.pulling[f] ? `FORCE ${S.force[f].toFixed(1)} nN` : 'FORCE OFF', `t = ${Math.round(S.t_ps[f] * 1000)} fs · xTB · 126 ATOMS`],
    pull:true,
  },
  dna: {
    title:'DNA tweezers',
    lede:'A machine built from DNA. A fuel strand grabs both arms and zips itself into a double helix, pulling the tweezers shut.',
    steps:S0 => S0, labels:[ { at:'fuel', text:['Fuel strand', 'the input'] }, { at:'arm2', text:['Arm 2', 'pulled shut'] }, { at:'arm1', text:['Arm 1', 'held still'] }, { at:'hinge', text:['Hinge', '4 unpaired bases'] } ],
    stack:true, X:1330, dx:-90,
    meta:f => [`FUEL BASE PAIRS ${S.bp[f]} / 16`, S.guided[f] ? 'SPRINGS ON · FIRST CONTACT GUIDED' : `ARM GAP ${S.gap[f].toFixed(1)} nm · UNGUIDED`, `t = ${S.t_ns[f] >= 1000 ? (S.t_ns[f] / 1000).toFixed(2) + ' µs' : Math.round(S.t_ns[f]) + ' ns'} · oxDNA · 140 NUCLEOTIDES`],
  },
};
const C = FILM[ID];
let S, A;
async function init(){
  [S, A] = await Promise.all([fetch(`render/${ID}/story.json`).then(r => r.json()), fetch(`render/${ID}/frames/anchors.json`).then(r => r.json())]);
  document.getElementById('title').textContent = C.title;
  document.getElementById('lede').textContent = C.lede;
  const steps = typeof C.steps === 'function' ? S.parts : C.steps;
  document.getElementById('steps').innerHTML = steps.map(s => `<div><i>✦</i><span>${s}</span></div>`).join('');
  window.READY = true;
}
async function show(f){
  const img = document.getElementById('mol');
  img.src = `render/${ID}/frames/${String(f).padStart(4, '0')}.png`;
  await img.decode().catch(() => {});
  const k = S.part[f];
  document.querySelectorAll('#steps div').forEach((d, i) => d.classList.toggle('on', i === k));
  document.getElementById('meta').innerHTML = C.meta(f).join('<br>');
  const dx = C.dx || 0, X = C.X || 1268;                     // optional shift of the molecule layer; labels in one column to its right
  const an = Object.fromEntries(Object.entries(A[String(f)]).map(([k, v]) => [k, typeof v[0] === 'number' ? [v[0] + dx, v[1]] : v]));
  img.style.transform = `translateX(${dx}px)`;
  let svg = '';
  // label rows follow their parts; keep at least 76 px between rows so they never collide or cross
  const rows = C.labels.map(L => ({ L, y:L.y ?? an[L.at][1] + (L.dy || 0) })).sort((a, b) => a.y - b.y);
  if (C.stack) for (let i = 1; i < rows.length; i++) rows[i].y = Math.max(rows[i].y, rows[i - 1].y + 76);
  for (const { L, y } of rows){
    const [ax, ay] = an[L.at], ly = y;
    svg += `<circle cx="${ax}" cy="${ay}" r="3" fill="#E6E8EF"/>` +
      `<polyline points="${ax},${ay} ${X - 26},${ly} ${X - 6},${ly}" fill="none" stroke="rgba(230,232,239,.6)" stroke-width="1"/>` +
      `<text class="lab" x="${X}" y="${ly - 4}">${L.text[0]}</text><text class="lab sub" x="${X}" y="${ly + 15}">${L.text[1]}</text>`;
  }
  if (C.burst && S.light[f]){                                 // light: orange rings spreading from the axle
    const [bx, by] = an[C.burst], age = Math.max(0, S.light_age[f]);
    for (const o of [0, .33, .66]){ const k = (age * 1.6 + o) % 1;
      svg += `<circle cx="${bx}" cy="${by}" r="${40 + 230 * k}" fill="none" stroke="#FF6B1A" stroke-width="${4 * (1 - k) + .5}" opacity="${(1 - k) * .9}"/>`; }
    svg += `<text class="lab" x="${bx + 150}" y="${by - 196}" style="fill:#FF6B1A">${C.burstLabel}</text>`;
  }
  if (C.box && an.box){                                       // shear: the outline of the crystal, from an affine fit
    svg += `<polygon points="${an.box.map(([x, y]) => `${x + dx},${y}`).join(' ')}" fill="none" stroke="rgba(230,232,239,.5)" stroke-width="1.2" stroke-dasharray="6 6"/>`;
  }
  if (C.arrowLabel && S.field && S.field[f] && an.axis){        // voltage: flat orange arrow along +x under the crystal
    const [[x1, y1], [x2, y2]] = an.axis.map(([x, y]) => [x + dx, y]), a = Math.atan2(y2 - y1, x2 - x1), h = 16;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2 - Math.cos(a) * 12}" y2="${y2 - Math.sin(a) * 12}" stroke="#FF6B1A" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M${x2},${y2} L${x2 - h * Math.cos(a - .45)},${y2 - h * Math.sin(a - .45)} L${x2 - h * Math.cos(a + .45)},${y2 - h * Math.sin(a + .45)} Z" fill="#FF6B1A"/>` +
      `<text class="lab" x="${x2 + 14}" y="${y2 + 5}" style="fill:#FF6B1A">${C.arrowLabel}</text>`;
  }
  if (C.pull && S.pulling[f]){                               // pull: orange arrows on the chain ends, pointing outward
    const [ax, ay] = an.end_a, [bx, by] = an.end_b, L = Math.hypot(bx - ax, by - ay) || 1, ux = (bx - ax) / L, uy = (by - ay) / L;
    const arrow = (x, y, dx, dy) => { const x2 = x + dx * 90, y2 = y + dy * 90, a = Math.atan2(dy, dx), h = 14;
      return `<line x1="${x + dx * 16}" y1="${y + dy * 16}" x2="${x2 - dx * 10}" y2="${y2 - dy * 10}" stroke="#FF6B1A" stroke-width="4" stroke-linecap="round"/><path d="M${x2},${y2} L${x2 - h * Math.cos(a - .45)},${y2 - h * Math.sin(a - .45)} L${x2 - h * Math.cos(a + .45)},${y2 - h * Math.sin(a + .45)} Z" fill="#FF6B1A"/>`; };
    svg += arrow(ax, ay, -ux, -uy) + arrow(bx, by, ux, uy) + `<text class="lab" x="${bx + ux * 100 + 10}" y="${by + uy * 100 - 14}" style="fill:#FF6B1A">Pull</text>`;
  }
  if (S.torque_on && S.torque_on[f]){
    const [rx, ry] = an.ring;
    svg += `<text class="lab" x="${rx - 250}" y="${ry + 128}" style="fill:#FF6B1A">${C.flowLabel}</text>`;
  }
  document.getElementById('ov').innerHTML = svg;
}
window.show = show;
init();
</script>
</body>
</html>
