<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/site/">
<title>97A · AI that designs molecular machines</title>
<meta name="description" content="AI that designs molecular machines.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  /* 1 · title + one machine */
  .hero{background:var(--bg); color:var(--txt); overflow:hidden}
  .hero .top{display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:40px; padding-top:8px; padding-bottom:4px; position:relative; overflow:hidden}
  h1{margin:0; font-weight:500; font-size:clamp(38px, 4vw, 56px); line-height:1.02; letter-spacing:-.035em}
  h1 span{color:var(--sky)}
  .stage{position:relative; height:256px}
  #gl, svg#ov{position:absolute; inset:-36px -60px}
  #gl{cursor:grab} #gl:active{cursor:grabbing} #gl canvas{display:block; width:100%; height:100%}
  svg#ov{pointer-events:none}
  .sec h2{margin:0; font-weight:500; font-size:24px; letter-spacing:-.02em}
  .sec h2 a{color:inherit; text-decoration:none} .sec h2 a:hover{color:var(--blue)}

  /* 2 · applications: title on its own line, one row; drag or scroll sideways */
  .apps{padding-block:36px 40px}
  .rowbox{position:relative}
  .more{position:absolute; right:8px; top:8px; z-index:2; padding:6px 12px; border-radius:99px; background:var(--ink); box-shadow:0 0 0 1.5px #fff; color:#fff;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; text-decoration:none}
  .more:hover{background:var(--blue)}
  .apps h2{margin-bottom:14px}
  .row{display:grid; grid-auto-flow:column; grid-auto-columns:104px; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory; cursor:grab;
    scrollbar-width:none; -ms-overflow-style:none; user-select:none; padding-top:2px}
  .row::-webkit-scrollbar{display:none} .row.drag{cursor:grabbing; scroll-snap-type:none}
  .card{scroll-snap-align:start; display:block; color:var(--ink); text-decoration:none}
  .card canvas{display:block; width:104px; height:104px; border-radius:24px; background:var(--bg); pointer-events:none; transition:transform .2s}
  .card:hover canvas{transform:translateY(-2px)}
  .card div{padding:9px 2px 0}
  .card b{display:block; font-weight:500; font-size:13.5px; line-height:1.25; letter-spacing:-.005em}
  .card small{display:block; margin-top:3px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}

  /* 3 · technology: layered system, short band; style switch in the footer (1-4) */
  .techbg{background:var(--bg); color:var(--txt); --line:#4A5266; --c-agent:#8A90A2; --c-designer:#C9CDD8; --c-structure:#8A90A2; --c-physics:#C9CDD8; --c-data:#8A90A2}
  .techbg.white{background:#fff; color:var(--ink); border-top:1px solid var(--sep); --line:#B4B9C2; --c-agent:#7A808C; --c-designer:#12151D; --c-structure:#7A808C; --c-physics:#12151D; --c-data:#7A808C}
  .tech{padding-block:32px 36px}
  .tech h2{margin-bottom:16px}
  .dia{position:relative; display:grid; width:max-content; max-width:100%; column-gap:36px; row-gap:10px}
  .dia .links{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; fill:none; stroke:var(--line); stroke-width:1.5}
  .dia .links .dash{stroke-dasharray:4 4}
  .nd{position:relative; border:1.5px solid var(--c); border-radius:10px; padding:8px 12px 9px; display:flex; flex-direction:column; gap:7px; min-width:0}
  .nd b{font-weight:500; font-size:14px; letter-spacing:-.01em; line-height:1.15; white-space:nowrap}
  .nd .ic{display:flex; flex-wrap:nowrap; gap:7px; color:var(--c)}
  .nd .ic svg{flex:none; width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .nd .ic .f, .nd .ic .fo{fill:currentColor; stroke:none} .nd .ic .o{stroke:currentColor}
  .agent{--c:var(--c-agent); grid-area:agent} .designer{--c:var(--c-designer); grid-area:designer} .structure{--c:var(--c-structure); grid-area:structure}
  .physics{--c:var(--c-physics); grid-area:physics} .data{--c:var(--c-data); grid-area:data}
  .techbg:not(.white) .designer, .techbg:not(.white) .physics{background:#1C2130}
  .techbg.white .designer{background:#12151D; color:var(--txt)} .techbg.white .designer .ic{color:#C9CDD8}
  .techbg.white .physics{background:#F3F4F6}
  /* flow: left to right, top level to base */
  .dia.flow{grid-template-columns:auto auto auto auto; grid-template-areas:"agent designer structure data" "agent designer physics data"; align-items:center}
  .dia.flow .designer .ic svg{width:24px; height:24px} .dia.flow .designer{padding:11px 14px 12px}
  /* levels: the stacked diagram, squeezed */
  .dia.levels{grid-template-columns:1fr 1fr; column-gap:24px; grid-template-areas:"agent agent" "designer designer" "structure physics" "data data"; row-gap:10px}
  .dia.levels .nd{flex-direction:row; align-items:center; gap:18px; padding:6px 12px; justify-self:center}
  .dia.levels .structure{justify-self:end} .dia.levels .physics{justify-self:start}
  .dia.levels .designer{padding-block:9px} .dia.levels .physics{padding-block:8px}
  @media (max-width:900px){
    .hero .top{grid-template-columns:1fr; gap:0} h1{font-size:36px}
    .stage{height:60vw} #gl, svg#ov{inset:0}
    .row{grid-auto-columns:46%}
    .dia{width:auto} .dia.flow{grid-template-columns:1fr 1fr; grid-template-rows:auto; grid-template-areas:"agent agent" "designer designer" "structure physics" "data data"; height:auto} .dia.flow .agent{height:auto}
  }
</style>
</head>
<body>

  <div class="bar"><nav class="wrap"><a class="logo" href="/">97A</a><div class="tabs"><a href="/apps/">Applications</a><a href="/technology/">Technology</a></div><a data-cta href="/contact/">Contact</a></nav></div>
  <div class="wrap top">
    <h1>AI that designs <span>molecular machines.</span></h1>
    <div class="stage"><div id="gl"></div><svg id="ov"></svg></div>
  </div>
</header>

<main>
  <section class="sec apps wrap">
    <h2><a href="/apps/">Applications</a></h2>
    <div class="rowbox"><a class="more" href="/apps/">More</a><div class="row" id="row"></div></div>
  </section>

  <div class="techbg white" id="techbg"><section class="sec tech wrap">
    <h2><a href="/technology/">Technology</a></h2>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-chat" viewBox="0 0 48 48"><path d="M8 10h32v20H22l-9 8v-8H8z"/><circle class="f" cx="17" cy="20" r="2.2"/><circle class="f" cx="24" cy="20" r="2.2"/><circle class="f" cx="31" cy="20" r="2.2"/></symbol>
  <symbol id="i-goal" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="9"/><circle class="fo" cx="24" cy="24" r="3.5"/></symbol>

  <symbol id="i-loop" viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path class="o" d="M34 6v8.5h-8.5"/></symbol>

</defs></svg>
    <div class="dia flow" id="dia">
      <svg class="links" id="links"></svg>
      <div class="nd agent"><b>Agent interface</b><span class="ic"><svg><use href="#i-chat"/></svg><svg><use href="#i-goal"/></svg></span></div>
      <div class="nd designer"><b>Designer</b><span class="ic"><svg><use href="#i-tree"/></svg><svg><use href="#i-hex"/></svg><svg><use href="#i-spark"/></svg><svg><use href="#i-hub"/></svg><svg><use href="#i-loop"/></svg></span></div>
      <div class="nd structure"><b>Structure models</b><span class="ic"><svg><use href="#i-ball"/></svg><svg><use href="#i-helix"/></svg><svg><use href="#i-lattice"/></svg></span></div>
      <div class="nd physics"><b>Physics models</b><span class="ic"><svg><use href="#i-well"/></svg><svg><use href="#i-force"/></svg><svg><use href="#i-md"/></svg><svg><use href="#i-orbit"/></svg><svg><use href="#i-beads"/></svg></span></div>
      <div class="nd data"><b>Quantum-accurate data</b><span class="ic"><svg><use href="#i-db"/></svg><svg><use href="#i-wave"/></svg><svg><use href="#i-grid"/></svg></span></div>
    </div>
  </section></div>
</main>
<footer class="site"><div class="wrap"><span>97A</span><span>© 2026</span></div></footer>

<script type="module">
import { Stage } from './live.js';
import { FILMS } from './films.js';
import { setup } from './appmols.js';
import { APPS, HOME } from './appsdata.js';
const $ = s => document.getElementById(s);

// 1 · one machine (?m=<id> previews another)
const f = FILMS.find(x => x.id === new URLSearchParams(location.search).get('m')) || FILMS.find(x => x.id === 'catcher');
const stage = new Stage($('gl'), null, { minimal:true, fill:x => Math.min(.95, x * 1.15) });
stage.load(f).then(() => { stage.ov = { svg:$('ov') }; });

// applications: molecule tiles; drag or scroll sideways; each opens its page
const row = $('row');
const picks = HOME.map(s => APPS.find(a => a.slug === s));
row.innerHTML = picks.map(a => `<a class="card" href="/apps/${a.slug}/" draggable="false"><canvas></canvas><div><b>${a.short}</b><small>${a.cs}</small></div></a>`).join('');
const views = [...row.querySelectorAll('.card')].map((el, i) => setup({ dataset:{ k:picks[i].k }, querySelector:() => el.querySelector('canvas') }));
// one structure moves at a time: hovering a card wakes its molecule and pauses the machine on top
let last = performance.now(), hot = -1;
(function loop(t){ if (hot >= 0) views[hot].tick(t - last); last = t; requestAnimationFrame(loop); })(last);
requestAnimationFrame(() => views.forEach(v => v.draw()));
row.querySelectorAll('.card').forEach((el, i) => {
  el.addEventListener('mouseenter', () => { hot = i; views[i].active(true); stage.pause(true); });
  el.addEventListener('mouseleave', () => { if (hot === i) hot = -1; views[i].active(false); stage.pause(false); });
});
let drag = null;
row.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; drag = { x:e.clientX, s:row.scrollLeft, moved:false }; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 4){ drag.moved = true; row.classList.add('drag'); } row.scrollLeft = drag.s - dx; });
addEventListener('pointerup', () => { if (!drag) return; const m = drag.moved; drag = null; row.classList.remove('drag'); if (m) row.addEventListener('click', e => e.preventDefault(), { capture:true, once:true }); });


// technology diagram: connectors drawn from the boxes' positions (side by side on wide screens, stacked on phones)
function links(){
  const dia = $('dia'), R = dia.getBoundingClientRect(), box = k => { const r = dia.querySelector('.' + k).getBoundingClientRect();
    return { l:r.left - R.left, r:r.right - R.left, t:r.top - R.top, b:r.bottom - R.top, cx:(r.left + r.right) / 2 - R.left, cy:(r.top + r.bottom) / 2 - R.top }; };
  const line = (a, b) => { const A = box(a), B = box(b);
    if (B.l >= A.r - 1){ const y = Math.max(A.t, B.t) < Math.min(A.b, B.b) ? (Math.max(A.t, B.t) + Math.min(A.b, B.b)) / 2 : null;
      return y != null ? `M${A.r} ${y}H${B.l}` : `M${A.r} ${A.cy}C${(A.r + B.l) / 2} ${A.cy} ${(A.r + B.l) / 2} ${B.cy} ${B.l} ${B.cy}`; }
    const x = Math.max(A.l, B.l) < Math.min(A.r, B.r) ? (Math.max(A.l, B.l) + Math.min(A.r, B.r)) / 2 : null;
    return x != null ? `M${x} ${A.b}V${B.t}` : `M${A.cx} ${A.b}C${A.cx} ${(A.b + B.t) / 2} ${B.cx} ${(A.b + B.t) / 2} ${B.cx} ${B.t}`; };
  const D = box('designer'), P = box('physics');
  const back = dia.classList.contains('levels') ? `M${P.r} ${P.cy}H${P.r + 20}V${D.cy}H${D.r}` : `M${P.cx} ${P.b}V${P.b + 14}H${D.cx}V${D.b}`;
  $('links').innerHTML = [['agent', 'designer'], ['designer', 'structure'], ['designer', 'physics'], ['structure', 'physics'], ['structure', 'data'], ['physics', 'data']]
    .map(([a, b]) => `<path d="${line(a, b)}"/>`).join('') + `<path class="dash" d="${back}"/>`;
}
function layout(){ $('dia').className = 'dia ' + (innerWidth <= 900 ? 'levels' : 'flow'); links(); }
addEventListener('resize', layout); document.fonts.ready.then(layout); layout();
</script>
</body>
</html>
