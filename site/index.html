<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/site/">
<title>A10 · Machines, designed atom by atom</title>
<meta name="description" content="A10 builds AI that simulates and designs molecules, materials and proteins that do work.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  :root{ --bg:#12151D; --txt:#F2F3F7; --txt2:#C9CDD8; --dim:#8A90A2; --line:rgba(230,232,239,.12); --sky:#8DB3F0; --orange:#FF6B1A;
         --font:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace }
  *{box-sizing:border-box} html,body{margin:0; background:var(--bg); color:var(--txt); font-family:var(--font); -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(ellipse 48% 60% at 68% 44%, #232C45 0%, #181D2A 50%, var(--bg) 100%) fixed}
  nav{height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 56px}
  .logo{font-weight:600; font-size:22px; letter-spacing:-.02em} .logo i{font-style:normal; color:var(--sky)}
  nav a{font-family:var(--mono); font-size:12.5px; letter-spacing:.08em; color:var(--txt2); text-decoration:none; text-transform:uppercase}
  .hero{display:grid; grid-template-columns:minmax(380px, 38%) 1fr; height:calc(100svh - 72px - 140px); min-height:560px; padding:0 56px}
  .left{align-self:center; padding-bottom:4vh}
  h1{margin:0; font-weight:500; font-size:clamp(44px, 5vw, 80px); line-height:1; letter-spacing:-.035em}
  h1 span{color:var(--sky)}
  .lead{margin:26px 0 0; max-width:440px; font-size:19px; line-height:1.5; color:var(--txt2)}
  .beliefs{list-style:none; margin:40px 0 0; padding:0; max-width:440px}
  .beliefs li{padding:13px 0; border-top:1px solid var(--line); font-size:15.5px; color:var(--dim); display:flex; gap:16px}
  .beliefs li b{font-family:var(--mono); font-weight:400; font-size:11.5px; color:var(--sky); padding-top:3px}
  .stage{position:relative; min-height:0}
  #gl{position:absolute; inset:0; cursor:grab} #gl:active{cursor:grabbing} #gl canvas{display:block; width:100%; height:100%}
  svg#ov{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .cap{position:absolute; right:12px; bottom:22px; width:300px; padding:14px 16px 16px; border:1px solid var(--line); border-radius:12px;
    background:rgba(18,21,29,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); pointer-events:none; overflow:hidden}
  .cap h2{margin:0; font-weight:500; font-size:15px; display:flex; justify-content:space-between; align-items:baseline}
  .cap h2 small{font-family:var(--mono); font-weight:400; font-size:11px; color:var(--dim)}
  .cap p{margin:6px 0 0; font-size:14px; line-height:1.4; color:var(--txt2); min-height:20px}
  .cap i{position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--sky)}
  .rail{height:140px; display:flex; gap:10px; align-items:center; padding:0 56px; border-top:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
  .rail button{all:unset; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 16px 10px 10px; border-radius:12px; opacity:.5; transition:opacity .25s, background .25s}
  .rail button:hover{opacity:.85} .rail button.on{opacity:1; background:rgba(255,255,255,.05)}
  .rail img{width:56px; height:56px; object-fit:contain; display:block}
  .rail b{display:block; font-weight:500; font-size:13.5px; white-space:nowrap}
  .rail small{font-family:var(--mono); font-size:11px; color:var(--dim)}
  @media (max-width:900px){
    nav{padding:0 16px} .hero{grid-template-columns:1fr; height:auto; padding:8px 16px 0}
    .left{padding:0} h1{font-size:44px} .lead{font-size:16px; margin-top:16px} .beliefs{margin-top:22px} .beliefs li{font-size:14px; padding:10px 0}
    .stage{height:72vw; min-height:340px; margin-top:12px} .cap{left:0; right:0; width:auto; bottom:8px}
    .rail{padding:0 16px; height:110px} .rail span{display:none} .rail button{padding:8px}
  }
</style>
</head>
<body>
<nav><div class="logo">A<i>10</i></div><a href="#">Contact</a></nav>
<main class="hero">
  <section class="left">
    <h1>Machines, designed <span>atom by atom.</span></h1>
    <p class="lead">We build AI that simulates and designs molecules, materials and proteins that do work.</p>
    <ul class="beliefs">
      <li><b>01</b>Everything that works is a machine made of atoms.</li>
      <li><b>02</b>We simulate the physics before anything is built.</li>
      <li><b>03</b>AI proposes the design; physics checks it.</li>
    </ul>
  </section>
  <section class="stage">
    <div id="gl"></div>
    <svg id="ov"></svg>
    <div class="cap"><h2><span id="name"></span><small id="size"></small></h2><p id="step"></p><i id="prog"></i></div>
  </section>
</main>
<div class="rail" id="rail"></div>
<script type="module">
import { Stage } from './live.js';
import { FILMS as ALL } from './films.js';
const FILMS = (await Promise.all(ALL.map(f => fetch(`live/${f.id}/scene.json`, { method:'HEAD' }).then(r => r.ok ? f : null).catch(() => null)))).filter(Boolean);
const $ = s => document.getElementById(s);
const stage = new Stage($('gl'), null, { minimal:true });
let cur = 0, loadedAt = 0, pending = false;
$('rail').innerHTML = FILMS.map((f, i) => `<button data-i="${i}"><img src="thumbs/${f.id}.png" alt=""><span><b>${f.name}</b><small>${f.size}</small></span></button>`).join('');
async function pick(i){
  cur = i; const f = FILMS[i];
  document.querySelectorAll('.rail button').forEach((b, k) => b.classList.toggle('on', k === i));
  $('name').textContent = f.name; $('size').textContent = f.size; $('step').textContent = '';
  await stage.load(f);
  stage.ov = { svg:$('ov') };
  loadedAt = performance.now(); stage.touched = 0;
}
stage.onFrame = (v, k) => {
  const f = FILMS[cur], part = stage.sc.story.part[k];
  if (f.short && $('step').textContent !== f.short[part]) $('step').textContent = f.short[part];
  $('prog').style.width = (v / 20 * 100) + '%';
  const el = (performance.now() - loadedAt) / 1000;          // next machine after one full film, unless it is being turned
  if (el > 20 && performance.now() - (stage.touched || 0) > 25000 && !pending){ pending = true; pick((cur + 1) % FILMS.length).then(() => pending = false); }
};
$('rail').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(+b.dataset.i); });
pick(0);
</script>
</body>
</html>
