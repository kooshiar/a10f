<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/site/">
<title>97A · AI that designs molecular machines</title>
<meta name="description" content="AI that designs molecular machines.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  /* 1 · title + one machine */
  .hero{background:var(--bg); color:var(--txt); overflow:hidden}
  .hero .top{display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:40px; padding-top:8px; padding-bottom:4px; position:relative; overflow:hidden}
  h1{margin:0; font-weight:500; font-size:clamp(38px, 4vw, 56px); line-height:1.02; letter-spacing:-.035em}
  h1 span{color:var(--sky)}
  .stage{position:relative; height:256px}
  #gl, svg#ov{position:absolute; inset:-36px -60px}
  #gl{cursor:grab} #gl:active{cursor:grabbing} #gl canvas{display:block; width:100%; height:100%}
  svg#ov{pointer-events:none}
  .sec h2{margin:0; font-weight:500; font-size:24px; letter-spacing:-.02em}

  /* 2 · applications: title on its own line, one row; drag or scroll sideways */
  .apps{padding-block:36px 40px}
  .rowbox{position:relative}
  .more{position:absolute; right:8px; top:8px; z-index:2; padding:6px 12px; border-radius:99px; background:var(--ink); box-shadow:0 0 0 1.5px #fff; color:#fff;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; text-decoration:none}
  .more:hover{background:var(--blue)}
  .apps h2{margin-bottom:14px}
  .row{display:grid; grid-auto-flow:column; grid-auto-columns:116px; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; cursor:grab;
    scrollbar-width:none; -ms-overflow-style:none; user-select:none}
  .row::-webkit-scrollbar{display:none} .row.drag{cursor:grabbing; scroll-snap-type:none}
  .card{scroll-snap-align:start; display:block; border:1px solid var(--rule); border-radius:12px; overflow:hidden; color:var(--ink); text-decoration:none; transition:border-color .2s}
  .card:hover{border-color:var(--ink)}
  .card canvas{display:block; width:100%; height:106px; background:var(--bg); pointer-events:none}
  .card div{padding:8px 8px 9px}
  .card small{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--blue)}
  .card b{display:block; margin-top:3px; min-height:2.5em; font-weight:500; font-size:12px; line-height:1.25; letter-spacing:-.01em}

  /* 3 · technology, dark like the top */
  .techbg{background:var(--bg); color:var(--txt)}
  .tech{display:grid; grid-template-columns:200px minmax(0, 1fr); align-items:center; gap:24px; padding-block:36px}
  .arch{display:grid; grid-template-columns:repeat(2, 280px); gap:12px}
  .box{height:132px; border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; justify-content:space-between}
  .box b{font-weight:500; font-size:19px; letter-spacing:-.02em; line-height:1.1}
  .design{background:#1F2638; color:var(--sky)}
  .phys{border:1.5px solid rgba(242,243,247,.4); color:var(--txt)}
  .icons{display:flex; gap:11px; align-items:end}
  .icons svg{width:28px; height:28px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke:var(--sky)}
  .icons .f{fill:var(--sky); stroke:none} .icons .o{stroke:var(--orange)} .icons .fo{fill:var(--orange); stroke:none} .icons .b{stroke:var(--blue)}
  .phys .icons svg{stroke:var(--txt2)} .phys .icons .f{fill:var(--blue)}

  @media (max-width:900px){
    .hero .top{grid-template-columns:1fr; gap:0} h1{font-size:36px}
    .stage{height:60vw} #gl, svg#ov{inset:0}
    .row{grid-auto-columns:46%}
    .tech{grid-template-columns:1fr; gap:14px} .arch{grid-template-columns:1fr 1fr; gap:10px} .box{height:120px; padding:12px} .box b{font-size:16px} .icons{gap:6px} .icons svg{width:22px; height:22px}
  }
</style>
</head>
<body>
<header class="hero">
  <div class="bar"><nav class="wrap"><a class="logo" href="/">97A</a><a href="/contact">Contact</a></nav></div>
  <div class="wrap top">
    <h1>AI that designs <span>molecular machines.</span></h1>
    <div class="stage"><div id="gl"></div><svg id="ov"></svg></div>
  </div>
</header>

<main>
  <section class="sec apps wrap">
    <h2>Applications</h2>
    <div class="rowbox"><a class="more" href="/apps">More</a><div class="row" id="row"></div></div>
  </section>

  <div class="techbg"><section class="sec tech wrap">
    <h2>Technology</h2>
    <div class="arch">
      <div class="box design"><b>Design agents</b>
        <div class="icons">
          <!-- reasoning: a branching tree -->
          <svg viewBox="0 0 48 48"><circle class="f" cx="24" cy="9" r="4"/><circle cx="11" cy="38" r="4"/><circle cx="24" cy="38" r="4"/><circle class="fo" cx="37" cy="38" r="4"/><path d="M24 13v8M24 21L11 34M24 21v13M24 21l13 13"/></svg>
          <!-- design: a ring being drawn -->
          <svg viewBox="0 0 48 48"><path d="M24 7l14 8v16l-14 8-14-8V15z"/><circle class="fo" cx="38" cy="15" r="4"/><path class="o" d="M30 40l9-9"/></svg>
          <!-- orchestration: one hub, many jobs -->
          <svg viewBox="0 0 48 48"><circle class="f" cx="24" cy="24" r="5"/><circle cx="8" cy="10" r="3"/><circle cx="40" cy="10" r="3"/><circle cx="8" cy="38" r="3"/><circle cx="40" cy="38" r="3"/><path d="M20 20l-9.5-7.5M28 20l9.5-7.5M20 28l-9.5 7.5M28 28l9.5 7.5"/></svg>
          <!-- loop: try, check, improve -->
          <svg viewBox="0 0 48 48"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path class="o" d="M34 6v8.5h-8.5"/></svg>
        </div>
      </div>
      <div class="box phys"><b>Physics models</b>
        <div class="icons">
          <!-- structure -->
          <svg viewBox="0 0 48 48"><path d="M12 34l12-8 12 8M24 26V12"/><circle class="f" cx="24" cy="12" r="5"/><circle cx="12" cy="34" r="5"/><circle cx="36" cy="34" r="5"/><circle class="f" cx="24" cy="26" r="3"/></svg>
          <!-- energy -->
          <svg viewBox="0 0 48 48"><path d="M6 8c4 0 6 30 18 30S38 14 42 14"/><circle class="fo" cx="24" cy="38" r="3.5"/><path class="b" d="M6 44h36"/></svg>
          <!-- forces -->
          <svg viewBox="0 0 48 48"><circle class="f" cx="24" cy="24" r="5"/><path class="o" d="M24 18V6M20 9l4-4 4 4M29 27l9 9M38 30v6h-6M19 27l-9 6M13 37l-4-3 3-5"/></svg>
          <!-- molecular dynamics: a path in time -->
          <svg viewBox="0 0 48 48"><path class="b" d="M6 36c5-14 9 6 14-8s9 2 13-10 7 2 9-4" stroke-dasharray="2 4"/><circle class="f" cx="42" cy="14" r="4.5"/><circle cx="6" cy="36" r="3"/></svg>
          <!-- electrons (DFT) -->
          <svg viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="18" ry="7"/><ellipse cx="24" cy="24" rx="18" ry="7" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="18" ry="7" transform="rotate(120 24 24)"/><circle class="fo" cx="24" cy="24" r="3.5"/></svg>
          <!-- coarse-grained beads -->
          <svg viewBox="0 0 48 48"><path d="M8 38c6-10 6-20 16-20s10-10 16-12"/><circle class="f" cx="8" cy="38" r="4.5"/><circle cx="16" cy="24" r="4.5"/><circle class="f" cx="28" cy="17" r="4.5"/><circle cx="40" cy="7" r="4.5"/></svg>
        </div>
      </div>
    </div>
  </section></div>
</main>
<footer class="site"><div class="wrap"><span>97A</span><span>© 2026</span></div></footer>

<script type="module">
import { Stage } from './live.js';
import { FILMS } from './films.js';
import { APPS, setup } from './appmols.js';
const $ = s => document.getElementById(s);

// 1 · one machine (?m=<id> previews another)
const f = FILMS.find(x => x.id === new URLSearchParams(location.search).get('m')) || FILMS.find(x => x.id === 'catcher');
const stage = new Stage($('gl'), null, { minimal:true, fill:x => Math.min(.95, x * 1.15) });
stage.load(f).then(() => { stage.ov = { svg:$('ov') }; });

// applications: rotating molecules from the /apps deck; drag or scroll sideways
const row = $('row');
row.innerHTML = APPS.map(([p, c, t]) => `<a class="card" href="/apps#p${p}" draggable="false"><canvas></canvas><div><small>${c}</small><b>${t}</b></div></a>`).join('');
const views = [...row.querySelectorAll('.card')].map((el, i) => { const fig = { dataset:{ k:APPS[i][3] }, querySelector:() => el.querySelector('canvas') }; return setup(fig); });
// one structure moves at a time: hovering a card wakes its molecule and pauses the machine on top
let last = performance.now(), hot = -1;
(function loop(t){ if (hot >= 0) views[hot].tick(t - last); last = t; requestAnimationFrame(loop); })(last);
requestAnimationFrame(() => views.forEach(v => v.draw()));
row.querySelectorAll('.card').forEach((el, i) => {
  el.addEventListener('mouseenter', () => { hot = i; views[i].active(true); stage.pause(true); });
  el.addEventListener('mouseleave', () => { if (hot === i) hot = -1; views[i].active(false); stage.pause(false); });
});
let drag = null;
row.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; drag = { x:e.clientX, s:row.scrollLeft, moved:false }; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 4){ drag.moved = true; row.classList.add('drag'); } row.scrollLeft = drag.s - dx; });
addEventListener('pointerup', () => { if (!drag) return; const m = drag.moved; drag = null; row.classList.remove('drag'); if (m) row.addEventListener('click', e => e.preventDefault(), { capture:true, once:true }); });

</script>
</body>
</html>
