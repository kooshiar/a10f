<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A10 · Option D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/3dmol/build/3Dmol-min.js"></script>
<script src="machines.js"></script><script src="palettes.js"></script><script src="site.js"></script>
<style>
  :root{ --ink:#111; --red:#E3120B; --blue:#1238D8; --yellow:#FFC400; --font:"Archivo",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace }
  *{box-sizing:border-box} html,body{margin:0; background:#fff; color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden}
  nav{display:flex; justify-content:space-between; align-items:center; height:72px; padding:0 48px; border-bottom:3px solid var(--ink)}
  .logo{font-weight:900; font-stretch:125%; font-size:24px; letter-spacing:-.02em}
  nav a{font-family:var(--mono); font-size:14px; color:var(--ink); text-decoration:none}
  .hero{position:relative; height:calc(100svh - 72px); min-height:640px; overflow:hidden}
  h1{position:absolute; left:48px; top:5vh; margin:0; z-index:2; font-weight:850; font-stretch:118%; font-size:clamp(46px, 6.2vw, 112px); line-height:.9; letter-spacing:-.035em; max-width:64vw}
  h1 span{color:var(--red)}
  .o{position:absolute} .o img{display:block; height:100%; width:auto; animation:drift 9s ease-in-out infinite}
  @keyframes drift{50%{transform:translate(0, -8px) rotate(.6deg)}}
  .shape{position:absolute; z-index:0}
  .lab{position:absolute; font-family:var(--mono); font-size:12.5px; white-space:nowrap; z-index:4}
  .lab b{font-weight:500}
  section{padding:0 48px 120px}
  .item{display:grid; grid-template-columns:200px 1fr 1.15fr; gap:40px; align-items:center; border-top:3px solid var(--ink); padding:40px 0}
  .item .num{font-weight:900; font-stretch:125%; font-size:120px; line-height:.8; letter-spacing:-.04em}
  .item h3{margin:0 0 18px; font-weight:800; font-stretch:112%; font-size:44px; letter-spacing:-.03em; line-height:1}
  .item p{margin:0; font-family:var(--mono); font-size:14.5px; line-height:1.9}
  .item .v{aspect-ratio:16/10; position:relative}
  .band{height:14px; display:grid; grid-template-columns:2fr 1fr 3fr; margin-bottom:96px}
  @media (max-width:860px){
    nav{padding:0 16px} h1{position:static; padding:28px 16px 0; max-width:none; font-size:12vw}
    .hero{height:auto; min-height:0} #collage{position:relative; height:118vw; margin-top:12px} section{padding:0 16px 64px}
    .item{grid-template-columns:1fr; gap:12px} .item .num{font-size:72px}
  }
</style>
</head>
<body>
<nav><div class="logo">A10</div><a href="#">contact@a10</a></nav>
<div class="hero" id="hero">
  <h1>Every machine is made of atoms. <span>We design them.</span></h1>
  <div id="collage"></div>
</div>
<div class="band"><div style="background:var(--red)"></div><div style="background:var(--yellow)"></div><div style="background:var(--blue)"></div></div>
<section id="list"></section>
<script>
const PAL = PALETTES.primary, L = Machines.LIST, M = Object.fromEntries(L.map(m => [m.id, m]));
const mobile = matchMedia('(max-width:860px)').matches;
// collage: [id, left, top, height] in % of the hero (vw for left, vh-ish via %), plus Bauhaus shapes behind
const PLACE = mobile ? [
  ['atp', 50, 0, 72], ['dna', 2, 2, 22], ['lce', 6, 28, 22], ['electrolyte', 30, 30, 18], ['mof', 0, 56, 30], ['rotor', 40, 66, 16], ['niti', 66, 74, 20],
] : [
  ['atp', 70, 5, 92], ['dna', 44, 45, 28], ['mof', 1, 57, 38], ['electrolyte', 25, 51, 21], ['rotor', 27, 76, 20], ['lce', 39.5, 71, 26], ['niti', 53, 73, 23],
];
const SHAPES = mobile ? [['circle', 'var(--yellow)', 48, 10, 30], ['square', 'var(--blue)', 4, 62, 14]] : [
  ['circle', 'var(--yellow)', 66, 17, 66], ['square', 'var(--blue)', 5, 63, 27], ['circle', 'var(--red)', 29.5, 79, 14],
];
const hero = mobile ? document.getElementById('collage') : document.getElementById('hero');
for (const [kind, c, l, t, s] of SHAPES)
  hero.insertAdjacentHTML('beforeend', `<div class="shape" style="left:${l}%; top:${t}%; width:${s}${mobile ? 'vh' : 'vh'}; height:${s}vh; background:${c}; border-radius:${kind === 'circle' ? '50%' : '0'}"></div>`);
PLACE.forEach(([id, l, t, h], i) => {
  hero.insertAdjacentHTML('beforeend', `<div class="o" style="left:${l}%; top:${t}%; height:${h}%; z-index:${id === 'atp' ? 3 : 3}"><img src="img/primary/${id}.png" style="animation-delay:${-i * 1.3}s" alt=""></div>`);
});
const C = ['var(--red)', 'var(--blue)', 'var(--yellow)'];
document.getElementById('list').innerHTML = L.map((m, i) => `<div class="item"><div class="num" style="color:${C[i % 3]}">${pad2(i)}</div>
  <div><h3>${m.name}</h3><p>${m.size} Å · ${m.kind}<br>${m.input}<br>${m.industry}</p></div><div class="v" data-id="${m.id}"></div></div>`).join('');
liveCards('.item .v', PAL, { zoom:1.05 });
</script>
</body>
</html>
