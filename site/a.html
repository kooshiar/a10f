<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A10</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0E0F12; --ink2:#5A5F69; --line:#E4E6EA; --blue:#2F5BFF; --orange:#FF6B1A; --font:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace }
  *{box-sizing:border-box} html,body{margin:0; background:#fff; color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased}
  nav{display:flex; align-items:center; justify-content:space-between; padding:28px 48px}
  .logo{font-weight:700; font-size:22px; letter-spacing:-.03em} .logo i{font-style:normal; color:var(--blue)}
  nav a{font-size:15px; font-weight:500; color:var(--ink); text-decoration:none; border:1.5px solid var(--ink); padding:9px 18px; border-radius:999px}
  .hero{height:calc(100svh - 92px); min-height:660px; display:grid; grid-template-columns:40% 60%; grid-template-rows:1fr auto; padding:0 48px 32px}
  h1{grid-column:1; align-self:center; margin:0; font-size:clamp(44px, 5.4vw, 86px); line-height:.98; letter-spacing:-.045em; font-weight:700}
  h1 em{font-style:normal; color:var(--blue)}
  #stage{grid-column:2; grid-row:1; position:relative; min-height:0}
  #stage video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff}
  .rail{grid-column:1 / span 2; display:grid; grid-template-columns:repeat(7, 1fr); border-top:1px solid var(--line)}
  .rail button{all:unset; cursor:pointer; padding:14px 10px 0; position:relative; text-align:left; min-width:0}
  .rail button img{width:100%; aspect-ratio:16/11; object-fit:cover; display:block; opacity:.5; transition:opacity .3s, transform .3s}
  .rail button.on img, .rail button:hover img{opacity:1}
  .rail .bar{position:absolute; left:10px; right:10px; top:-1px; height:3px; background:transparent}
  .rail .bar i{display:block; height:100%; width:0; background:var(--blue)}
  .rail span{display:block; font-size:13px; font-weight:600; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rail small{font-family:var(--mono); font-size:11.5px; color:var(--ink2)}
  section{padding:120px 48px 140px}
  h2{font-size:44px; letter-spacing:-.035em; font-weight:700; margin:0 0 56px}
  .grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:28px}
  .card{border:1px solid var(--line); border-radius:4px; overflow:hidden}
  .card video{width:100%; aspect-ratio:16/11; display:block; background:#fff}
  .card .t{display:grid; grid-template-columns:auto 1fr auto; gap:4px 14px; padding:18px 20px 20px; border-top:1px solid var(--line)}
  .card .n{font-family:var(--mono); font-size:12px; color:var(--blue); padding-top:5px}
  .card b{font-size:21px; font-weight:600; letter-spacing:-.02em}
  .card .s{font-family:var(--mono); font-size:13px; padding-top:5px}
  .card .m{grid-column:2 / span 2; font-size:14.5px; color:var(--ink2)}
  @media (max-width:860px){
    nav{padding:20px 16px} .hero{grid-template-columns:1fr; grid-template-rows:auto auto auto; padding:0 16px 24px; height:auto; min-height:0}
    h1{grid-column:1; padding:8px 0 4px} #stage{grid-column:1; grid-row:2; aspect-ratio:16/11}
    .rail{grid-column:1; grid-template-columns:repeat(7, 38%); overflow-x:auto} section{padding:72px 16px} .grid{grid-template-columns:1fr} h2{font-size:32px}
  }
</style>
</head>
<body>
<nav><div class="logo">A<i>10</i></div><a href="#">Contact</a></nav>
<div class="hero">
  <h1>AI that understands and designs matter, <em>atom by atom</em></h1>
  <div id="stage"><video id="hero" muted playsinline preload="auto"></video></div>
  <div class="rail" id="rail"></div>
</div>
<section>
  <h2>Seven machines, 10 Å to 220 Å</h2>
  <div class="grid" id="grid"></div>
</section>
<script>
const L = [
  { id:'rotor',       size:'10 Å',  name:'Light-driven rotor',     kind:'Small molecule',   industry:'Smart materials',  input:'Light → rotor turns' },
  { id:'niti',        size:'17 Å',  name:'Shape-memory alloy',     kind:'Alloy',            industry:'Medical devices',  input:'Heat → lattice shears' },
  { id:'electrolyte', size:'20 Å',  name:'Solid electrolyte',      kind:'Crystal',          industry:'Batteries',        input:'Voltage → Li⁺ flow' },
  { id:'polymer',     size:'35 Å',  name:'Stress-sensing polymer', kind:'Polymer',          industry:'Coatings, aerospace', input:'Force → ring opens, colour on' },
  { id:'mof',         size:'40 Å',  name:'CO₂-capture MOF',        kind:'Porous framework', industry:'Carbon capture',   input:'Flue gas → CO₂ trapped' },
  { id:'dna',         size:'120 Å', name:'DNA tweezers',           kind:'DNA',              industry:'Diagnostics',      input:'Fuel strand → arms close' },
  { id:'atp',         size:'220 Å', name:'ATP synthase',           kind:'Protein',          industry:'Drugs, cell energy', input:'Proton flow → rotor turns' },
];
const rail = document.getElementById('rail'), hero = document.getElementById('hero');
rail.innerHTML = L.map((m, i) => `<button data-i="${i}"><div class="bar"><i></i></div><img src="videos/${m.id}.jpg" alt=""><span>${m.name}</span><small>${m.size}</small></button>`).join('');
let cur = 0;
function pick(i){
  cur = i; rail.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === i); b.querySelector('.bar i').style.width = k < i ? '0' : '0'; });
  hero.src = `videos/${L[i].id}.mp4`; hero.currentTime = 0; hero.play().catch(() => {});
}
hero.addEventListener('timeupdate', () => { const b = rail.children[cur]; if (b && hero.duration) b.querySelector('.bar i').style.width = (hero.currentTime / hero.duration * 100) + '%'; });
hero.addEventListener('ended', () => pick((cur + 1) % L.length));
rail.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(+b.dataset.i); });
pick(L.length - 1);
document.getElementById('grid').innerHTML = L.map((m, i) => `<div class="card"><video data-src="videos/${m.id}.mp4" poster="videos/${m.id}.jpg" muted loop playsinline preload="none"></video>
  <div class="t"><span class="n">${String(i + 1).padStart(2, '0')}</span><b>${m.name}</b><span class="s">${m.size}</span><span class="m">${m.industry} · ${m.input}</span></div></div>`).join('');
const io = new IntersectionObserver(es => es.forEach(e => { const v = e.target;
  if (e.isIntersecting){ if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause(); }), { threshold:.35 });
document.querySelectorAll('.card video').forEach(v => io.observe(v));
</script>
</body>
</html>
