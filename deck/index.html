<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale</title>
<script src="https://unpkg.com/3dmol/build/3Dmol-min.js"></script>
<script src="scenes.js"></script>
<style>
  :root{
    --font-text:"SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --accent:#2a78d6; --inset:clamp(28px,5vw,84px);
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:#fff; color:var(--ink); font-family:var(--font-text); -webkit-font-smoothing:antialiased}
  section{height:100dvh; overflow:hidden; display:flex; flex-direction:column; padding:clamp(48px,7vh,80px) var(--inset) clamp(36px,5vh,56px)}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(34px,5vw,62px); line-height:1.04; letter-spacing:-.03em; margin:0; max-width:22ch}
  .row{position:relative; flex:1; min-height:0; display:flex; align-items:flex-end; justify-content:space-between; gap:clamp(20px,2.6vw,40px); padding-top:clamp(12px,2vh,24px)}
  .row::after{content:''; position:absolute; left:0; right:0; bottom:26px; height:1px; background:#d9d6cf}
  .tier{display:flex; flex-direction:column; align-items:center; gap:4px; flex:none}
  .wrap{position:relative; margin-bottom:10px}
  .viz{position:relative; width:var(--s); height:var(--s); cursor:grab}
  .viz canvas{display:block}
  .dim{position:absolute; left:calc(100% + 6px); bottom:10%; font-size:12.5px; color:var(--muted); white-space:nowrap}
  .tier .n{font-family:var(--font-display); font-weight:600; letter-spacing:-.025em; font-size:clamp(20px,1.9vw,26px); line-height:1.15; white-space:nowrap}
  .tier .d{font-family:var(--font-display); font-weight:700; letter-spacing:-.03em; font-size:clamp(34px,3.4vw,48px); color:var(--accent); line-height:1}
  .tier .i{font-size:clamp(12.5px,1.05vw,14px); color:var(--muted); text-align:center; white-space:nowrap; margin-top:4px}
  .tier .yr{position:relative; z-index:1; margin-top:14px; height:34px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
  .tier .yr i{width:9px; height:9px; border-radius:50%; background:var(--ink); margin-top:4px; box-shadow:0 0 0 4px #fff}
  @media (max-width:900px){ section{height:auto; overflow:visible} .row{flex-wrap:wrap; justify-content:center} .row::after{display:none} }
</style>
</head>
<body>
<section>
  <h1>AI will design $6T of industry in the next 5 years</h1>
  <div class="row" id="row"></div>
</section>

<script>
const TIERS = [
  { n:'100 atoms', dim:'12 Å',  usd:'$3T', ind:'Chips · Alloys · Crop science',   year:'2018' },
  { n:'1k',        dim:'32 Å',  usd:'$4T', ind:'Batteries · Plastics · Catalysts', year:'2022' },
  { n:'10k',       dim:'64 Å',  usd:'$5T', ind:'Drugs · Enzymes · Food',           year:'2024' },
  { n:'100k',      dim:'130 Å', usd:'$6T', ind:'Antibodies · Vaccines · Gene therapy', year:'2026' }
];
const base = Math.min(innerHeight * 0.15, innerWidth * 0.09);
const sizes = TIERS.map((_, i) => Math.round(base * Math.pow(1.45, i)));
const row = document.getElementById('row');
TIERS.forEach((t, i) => {
  const d = document.createElement('div'); d.className = 'tier';
  d.innerHTML = `<div class="wrap"><div class="viz" id="v${i}" style="--s:${sizes[i]}px"></div><div class="dim">${t.dim}</div></div>
    <div class="n">${t.n}</div><div class="d">${t.usd}</div><div class="i">${t.ind}</div><div class="yr"><i></i>${t.year}</div>`;
  row.appendChild(d);
});

const xyz = atoms => atoms.length + '\n\n' + atoms.map(a => `${a[0]} ${a[1].toFixed(3)} ${a[2].toFixed(3)} ${a[3].toFixed(3)}`).join('\n');
function viewer(i){
  const v = $3Dmol.createViewer(document.getElementById('v' + i), { backgroundColor:'#ffffff', antialias:true });
  v.setViewStyle({ style:'outline', color:'black', width:0.04 });
  return v;
}
function box(v, L, o){
  const P = i => ({ x:o[0] + ((i & 1) ? L : 0), y:o[1] + ((i & 2) ? L : 0), z:o[2] + ((i & 4) ? L : 0) });
  for (let i = 0; i < 8; i++) for (const b of [1, 2, 4]) if (!(i & b))
    v.addCylinder({ start:P(i), end:P(i | b), radius:L * .0035, color:'#c9c6be', fromCap:1, toCap:1 });
}
function finish(v, i, L, o){
  box(v, L, o);
  v.zoomTo(); v.zoom(0.9); v.rotate(16, 'x'); v.rotate(-26, 'y'); v.render();
  const el = document.getElementById('v' + i);
  el.addEventListener('mouseenter', () => v.spin('y', 1.4));
  el.addEventListener('mouseleave', () => v.spin(false));
}
function swap(v, slot, text, fmt, styles){       // replace one model's atoms, keep the camera
  const view = v.getView();
  if (slot.m) v.removeModel(slot.m);
  slot.m = v.addModel(text, fmt);
  for (const [sel, st] of styles) slot.m.setStyle(sel, st);
  v.setView(view); v.render();
}
const anims = [], C = Scenes.CYCLE;

/* 1: ordered NiAl alloy growing out of a gas, then melting away */
(function(){
  const s = Scenes.alloy(), v = viewer(0), slot = {};
  const st = [[{ elem:'Ni' }, { sphere:{ scale:.5, color:'#2a78d6' } }], [{ elem:'Al' }, { sphere:{ scale:.5, color:'#eb6834' } }]];
  const frame = (T, t) => swap(v, slot, xyz(s.frame(T, t)), 'xyz', st);
  frame(0, 0); finish(v, 0, s.L, s.origin); anims.push({ fps:24, frame });
})();

/* 2: MOF-5 cage, CO2 diffusing in, binding at the zinc clusters, leaving */
(function(){
  const s = Scenes.mof(), v = viewer(1), slot = {};
  v.addModel(xyz(s.framework), 'xyz');
  v.setStyle({}, { stick:{ radius:.22, color:'#8d94a0' } });
  v.setStyle({ elem:'H' }, {});
  v.setStyle({ elem:'Zn' }, { sphere:{ scale:.55, color:'#1baf7a' } });
  const st = [[{ elem:'C' }, { sphere:{ scale:.62, color:'#1d1d1f' } }], [{ elem:'O' }, { sphere:{ scale:.62, color:'#e24b4a' } }]];
  const frame = (T, t) => swap(v, slot, xyz(s.frame(T, t)), 'xyz', st);
  frame(0, 0); finish(v, 1, s.L, s.origin); anims.push({ fps:24, frame });
})();

/* 3: ubiquitin folding from a floppy chain, breathing, unfolding */
(async function(){
  const pdb = await fetch('https://files.rcsb.org/download/1D3Z.pdb').then(r => r.text());
  const s = Scenes.fold(pdb), v = viewer(2), slot = {};
  const st = [[{}, { cartoon:{ color:'spectrum', thickness:.6 } }]];
  const frame = (T, t) => swap(v, slot, s.frame(T, t), 'pdb', st);
  frame(0, 0); finish(v, 2, s.L, s.origin); anims.push({ fps:20, frame });
})();

/* 4: antibody searching for PD-1, clamping on, turning as one, letting go */
(async function(){
  const pdb = await fetch('https://files.rcsb.org/download/5JXE.pdb').then(r => r.text());
  const s = Scenes.bind(pdb), v = viewer(3), fab = {}, pd = {};
  const sf = [[{}, { cartoon:{ color:'#9aa3b2', thickness:.5 } }]], sp = [[{}, { cartoon:{ color:'#eb6834', thickness:.6 } }]];
  const frame = (T, t) => { const f = s.frame(T, t); swap(v, fab, f.fab, 'pdb', sf); swap(v, pd, f.pd1, 'pdb', sp); };
  frame(0, 0); finish(v, 3, s.L, s.origin); anims.push({ fps:14, frame });
})();

const last = new Map();
function loop(ms){
  const t = ms / 1000, T = t % C;
  if (!document.hidden) for (const a of anims){
    if (ms - (last.get(a) || 0) >= 1000 / a.fps){ last.set(a, ms); try { a.frame(T, t); } catch(e){ console.error(e); } }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') location.href = '../deck.html'; });
</script>
</body>
</html>
