<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script async src="/site/analytics.js?v=1"></script>
<script type="module" src="/site/auth.js"></script>
<title>K14 · Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site/frame.css">
<link rel="icon" href="/site/favicon.svg">
<style>
  main.wrap{min-height:calc(100vh - 57px - 65px); display:grid; align-items:center; justify-items:start; padding-block:64px}
  form{width:min(460px, calc(100% - 32px)); display:flex; flex-direction:column; gap:14px}
  input, textarea{font:inherit; font-size:16px; color:var(--ink); background:#fff; border:1.5px solid var(--rule); border-radius:12px; padding:14px 16px; outline:none}
  input:focus, textarea:focus{border-color:var(--ink)}
  textarea{min-height:160px; resize:vertical}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
  button{all:unset; cursor:pointer; align-self:flex-start; margin-top:6px; height:44px; padding:0 24px; border-radius:99px; background:var(--ink); color:#fff;
    font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase}
  button:disabled{opacity:.5; cursor:default}
  /* who is writing: one choice; an app page link prefills what it is about */
  fieldset{border:0; margin:0 0 4px; padding:0; display:flex; flex-wrap:wrap; gap:8px}
  legend{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin-bottom:10px; padding:0}
  .as input{position:absolute; opacity:0; pointer-events:none}
  .as span{display:inline-block; padding:9px 15px; border-radius:99px; border:1.5px solid var(--rule); background:#fff; font-size:14px; color:var(--ink); cursor:pointer}
  .as input:checked + span{border-color:var(--blue); background:var(--blue); color:#fff}
  .as input:focus-visible + span{outline:2px solid var(--blue); outline-offset:2px}
  .about{font-size:14px; color:var(--ink2)} .about b{color:var(--ink); font-weight:500}
  .msg{font-size:18px; color:var(--ink)} .err{font-family:var(--mono); font-size:12px; color:#C0392B; min-height:16px}
</style>
</head>
<body>
<header class="site"><div class="bar"><nav class="wrap"><a class="logo" href="/"><img src="/site/mark.svg" alt="">K14</a><div class="tabs"><a href="/apps/">Apps</a><a href="/tech/">Tech</a></div><a data-cta href="/contact/" class="on">Contact</a></nav></div></header>
<main class="wrap">
  <form id="f" novalidate>
    <fieldset id="as"><legend>I am a</legend>
      <label class="as"><input type="radio" name="interest" value="corporate"><span>Corporate partner</span></label>
      <label class="as"><input type="radio" name="interest" value="investor"><span>Investor</span></label>
      <label class="as"><input type="radio" name="interest" value="scientist"><span>Scientist</span></label>
      <label class="as"><input type="radio" name="interest" value="lab"><span>Lab or testing partner</span></label>
      <label class="as"><input type="radio" name="interest" value="founder"><span>Founder for a spinoff</span></label>
      <label class="as"><input type="radio" name="interest" value="other"><span>Other</span></label>
    </fieldset>
    <p class="about" id="about" hidden></p><input type="hidden" name="about" id="aboutv">
    <input name="name" placeholder="Name" autocomplete="name" required>
    <input name="linkedin" type="url" placeholder="LinkedIn URL" autocomplete="url">
    <textarea name="message" placeholder="Message" required></textarea>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button>Send</button>
    <div class="err" id="err"></div>
  </form>
</main>
<footer class="site"><div class="wrap"><span class="logo"><img src="/site/mark.svg" alt="">K14</span><span>© 2026</span></div></footer>
<script type="module">
import { APPS } from '/site/appsdata.js';
// from an app page: /contact/?about=<app slug> (and ?as=<interest>)
const q = new URLSearchParams(location.search), app = APPS.find(a => a.slug === q.get('about'));
if (app){ const ab = document.getElementById('about'); ab.hidden = false; ab.innerHTML = 'About <b></b>'; ab.querySelector('b').textContent = app.title; document.getElementById('aboutv').value = app.slug; }
const pre = document.querySelector(`#as input[value="${q.get('as') || (app ? 'corporate' : '')}"]`); if (pre) pre.checked = true;
const f = document.getElementById('f'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = '';
  const d = Object.fromEntries(new FormData(f));
  if (!d.interest) { err.textContent = 'Choose who you are.'; return; }
  if (!d.name.trim() || !d.message.trim()) { err.textContent = 'Name and message are needed.'; return; }
  if (d.linkedin && !/^https?:\/\/([a-z]+\.)?linkedin\.com\//i.test(d.linkedin)) { err.textContent = 'That doesn’t look like a LinkedIn URL.'; return; }
  const b = f.querySelector('button'); b.disabled = true;
  try {
    const r = await fetch('/api/contact', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(d) });
    const j = await r.json();
    if (!j.ok) throw 0;
    try { gtag('event', 'contact_sent'); window.osTrack && osTrack('contact_sent'); } catch (e) {}
    f.innerHTML = '<p class="msg">Sent. Thank you.</p>';
  } catch { b.disabled = false; err.textContent = 'Couldn’t send. Please try again.'; }
});
</script>
</body>
</html>
