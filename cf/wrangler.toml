name = "a10-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "97a.io", custom_domain = true },
  { pattern = "www.97a.io", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/", "/api/*", "/decks", "/decks/*"]

# every contact message is stored here before it is emailed
[[d1_databases]]
binding = "DB"
database_name = "a10-contact"
database_id = "a02ba68b-25d6-4c19-93cc-d0f9b88d359c"
