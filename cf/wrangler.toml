name = "a10-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "97a.io", custom_domain = true },
  { pattern = "www.97a.io", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/", "/api/*"]
